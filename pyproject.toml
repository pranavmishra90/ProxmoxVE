[project]
name = "proxmoxve"
version = "0.1.0"
requires-python = ">=3.14,<3.16"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "python-semantic-release>=10.7.0",
  "ruff>=0.17.3",
  "ty>=0.0.95",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.workspace]
members = []

# Lint and Format
#------------------------------------------------------------------------

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E402", "E501"]
exclude = [
  "tmp",
  "build",
  "dist",
  ".venv",
  "env",
  "venv",
  ".eggs",
  "*.egg-info",
  ".git",
  ".hg",
  ".mypy_cache",
  ".pytest_cache",
  "__pypackages__",
]

# Test
#------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-s -v -W ignore::UserWarning -W ignore::DeprecationWarning -W ignore::FutureWarning"
testpaths = [".github/workflows/test"]
python_files = ["test_*.py", "*_test.py"]


# Version control
#------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
assets = []
# build_command_env = ['GH_TOKEN']
# build_command = ''
commit_message = "ci(semantic-release): automatic update - v{version}"
commit_parser = "conventional"

logging_use_named_masks = false
allow_zero_version = true
major_on_zero = true
no_git_verify = false

tag_format = "v{version}"
upload_to_release = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "FacsimiLab Bot <195262995+facsimilab-bot@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]


[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop|dev"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.branches.feat]
match = "feat/*"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.fix]
match = "fix/*"
prerelease = true
prerelease_token = "alpha"


[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false
